name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-templates: true

      - name: Inject Discord webhook (build-time secret)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "Injecting webhook into project.godot"
            # project.godot has [discord] webhook_url=""  (scenes/gameover/entry_form.gd:24 reads this)
            sed -i "s|^webhook_url=\"\"|webhook_url=\"$WEBHOOK\"|" project.godot
            grep -F 'webhook_url=' project.godot || true
          else
            echo "No DISCORD_WEBHOOK_URL secret set — build will use placeholder (simulated 204)"
          fi

      - name: Verify Godot version
        run: godot --version

      - name: List export templates (debug)
        run: |
          ls -R ~/.local/share/godot/export_templates/ 2>&1 | head -n 100 || true
          echo "Godot binary: $(which godot) $(godot --version)"

      - name: Export Web build
        run: |
          mkdir -p docs
          # --verbose adds 877 Orphan StringName lines and hides real errors; omit it
          godot --headless --export-release "GitHub Pages" docs/index.html 2>&1 | tee export.log
          echo "--- export.log filtered ---"
          grep -i "error\|export\|template\|failed\|Godot Engine" export.log | head -n 100 || true
          ls -lh docs/ || true
          test -f docs/index.html || (echo "Export failed — docs/index.html missing" && cat export.log && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
